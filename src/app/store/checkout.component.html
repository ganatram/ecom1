<div class="container-fluid">
  <div class="row">
    <div class="col bg-dark text-white">
      <a class="navbar-brand">SPORTS STORE</a>
    </div>
  </div>
</div>

<div *ngIf="orderSent" class="m-2 text-center">
  <h2>Thanks!</h2>
  <p>Thanks for placing your order.</p>
  <p>We'll ship your goods as soon as possible.</p>
  <button class="btn btn-primary" routerLink="/store">Return to Store</button>
</div>
<form
  *ngIf="!orderSent"
  (ngSubmit)="submitOrder(form)"
  class="m-2"
  novalidate
  #form="ngForm"
>
  <div class="form-group">
    <label>Name</label>
    <input
      class="form-control"
      name="name"
      required
      [(ngModel)]="order.name"
      #name="ngModel"
    />
    <span *ngIf="submitted && name.invalid"> Please enter an name </span>
  </div>
  <div class="form-group">
    <label>Address</label>
    <input
      class="form-control"
      name="address"
      required
      [(ngModel)]="order.address"
      #address="ngModel"
    />
    <span *ngIf="submitted && address.invalid"> Please enter an address </span>
  </div>
  <div class="form-group">
    <label>City</label>
    <input
      class="form-control"
      name="city"
      required
      [(ngModel)]="order.city"
      #city="ngModel"
    />
    <span *ngIf="submitted && city.invalid"> Please enter an city </span>
  </div>
  <div class="form-group">
    <label>State</label>
    <input
      class="form-control"
      name="state"
      required
      [(ngModel)]="order.state"
      #state="ngModel"
    />
    <span *ngIf="submitted && state.invalid"> Please enter an state </span>
  </div>
  <div class="form-group">
    <label>Zip/Postal Code</label>
    <input
      class="form-control"
      name="zip"
      required
      [(ngModel)]="order.zip"
      #zip="ngModel"
    />
    <span *ngIf="submitted && zip.invalid"> Please enter an zip </span>
  </div>
  <div class="form-group">
    <label>Country</label>
    <input
      class="form-control"
      name="country"
      required
      [(ngModel)]="order.country"
      #country="ngModel"
    />
    <span *ngIf="submitted && country.invalid"> Please enter an country </span>
  </div>
  <div class="text-center">
    <button class="btn btn-secondary m-1" routerLink="/cart">Back</button>
    <button class="btn btn-primary m-1" type="submit">Complete Order</button>
  </div>
</form>
